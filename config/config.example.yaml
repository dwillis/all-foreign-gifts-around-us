# Configuration file for Foreign Gifts Tracker
# Copy this file to config.yaml and fill in your values

api:
  # API keys for LLM services
  anthropic_key: "your-anthropic-api-key-here"
  groq_key: "your-groq-api-key-here"

  # Model selection
  anthropic_model: "claude-3-sonnet-20240229"
  groq_model: "llama3-8b-8192"

paths:
  # Data directory paths
  raw_data: "data/raw"
  raw_pdfs: "data/raw/pdfs"
  raw_text: "data/raw/text"
  processed_data: "data/processed"
  processed_json: "data/processed/json"
  output_data: "data/output"

extraction:
  # LLM extraction parameters
  batch_size: 10
  temperature: 1.0
  max_tokens: 1024
  top_p: 1

  # Retry configuration
  max_retries: 3
  retry_delay: 2  # seconds

database:
  # Database configuration
  name: "gifts.db"
  path: "data/output"

federal_register:
  # Federal Register API configuration
  base_url: "https://www.federalregister.gov/api/v1"
  search_term: "foreign gifts"
  per_page: 20

logging:
  # Logging configuration
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/gifts_tracker.log"
  console: true
