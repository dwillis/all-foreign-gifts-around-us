[project]
name = "all-foreign-gifts-around-us"
version = "0.1.0"
description = "Structured data and a browsable dataset of tangible gifts given to U.S. federal employees by foreign governments, extracted from Federal Register notices."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "datasette>=0.65",
    "llm>=0.31",
    "llm-anthropic>=0.25.1",
    "llm-ollama>=0.9.0",
    "natural-pdf[all]>=0.6.5",
    "pydantic>=2.13.4",
    "requests>=2.31.0",
    "sqlite-utils>=3.35",
]

[project.scripts]
gifts = "foreign_gifts.cli:cli"

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreign_gifts"]
